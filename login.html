
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SkillBridge</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eaf2ff, #f8fbff);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            color: #2563eb;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            background: #f1f5f9;
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .tabs button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            font-size: 15px;
        }

        .tabs button.active {
            background: #2563eb;
            color: white;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #2563eb;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">SkillBridge</div>
        <p class="subtitle">Build skills. Bridge your career.</p>

        <div class="tabs">
            <button type="button" id="loginTab" class="active"
                    onclick="showForm('login')">Login</button>
            <button type="button" id="signupTab"
                    onclick="showForm('signup')">Sign Up</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="submit-btn">Login</button>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signupForm" class="hidden">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="signupEmail">Email Address</label>
                <input type="email" id="signupEmail"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="signupPassword">Create Password</label>
                <input type="password" id="signupPassword"
                       placeholder="At least 8 characters"
                       minlength="8" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Re-enter your password"
                       minlength="8" required>
            </div>

            <button type="submit" class="submit-btn">
                Create Account
            </button>
        </form>

        <p id="message" class="message" role="status"></p>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000";

        function showForm(type) {
            const isLogin = type === "login";

            document.getElementById("loginForm")
                .classList.toggle("hidden", !isLogin);

            document.getElementById("signupForm")
                .classList.toggle("hidden", isLogin);

            document.getElementById("loginTab")
                .classList.toggle("active", isLogin);

            document.getElementById("signupTab")
                .classList.toggle("active", !isLogin);

            const message = document.getElementById("message");
            message.textContent = "";
            message.style.color = "#2563eb";
        }

        function showMessage(text, success = false) {
            const message = document.getElementById("message");
            message.textContent = text;
            message.style.color = success ? "#15803d" : "#dc2626";
        }

        // Open signup tab when URL contains ?mode=signup
        if (new URLSearchParams(window.location.search).get("mode") === "signup") {
            showForm("signup");
        }

        // SIGNUP
        document.getElementById("signupForm")
            .addEventListener("submit", async function(event) {
                event.preventDefault();

                const fullName = document.getElementById("fullName").value.trim();
                const email = document.getElementById("signupEmail").value.trim();
                const password = document.getElementById("signupPassword").value;
                const confirmPassword = document.getElementById("confirmPassword").value;

                if (password.length < 8) {
                    showMessage("Password must be at least 8 characters.");
                    return;
                }

                if (password !== confirmPassword) {
                    showMessage("Passwords do not match!");
                    return;
                }

                const button = this.querySelector('button[type="submit"]');
                button.disabled = true;
                button.textContent = "Creating account...";

                try {
                    const response = await fetch(`${API_URL}/api/signup`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            full_name: fullName,
                            email: email,
                            password: password
                        })
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        showMessage(result.message || "Signup failed.");
                        return;
                    }

                    this.reset();
                    showMessage("Account created! You can now log in.", true);

                    setTimeout(() => showForm("login"), 1200);

                } catch (error) {
                    showMessage(
                        "Cannot connect to the backend. Check that Flask is running."
                    );
                    console.error(error);
                } finally {
                    button.disabled = false;
                    button.textContent = "Create Account";
                }
            });

        // LOGIN
        document.getElementById("loginForm")
            .addEventListener("submit", async function(event) {
                event.preventDefault();

                const email = document.getElementById("loginEmail").value.trim();
                const password = document.getElementById("loginPassword").value;
                const button = this.querySelector('button[type="submit"]');

                button.disabled = true;
                button.textContent = "Logging in...";

                try {
                    const response = await fetch(`${API_URL}/api/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, password })
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        showMessage(result.message || "Login failed.");
                        return;
                    }

                    // Save logged-in user for other SkillBridge pages
                    sessionStorage.setItem(
                        "skillbridgeUser",
                        JSON.stringify(result.user)
                    );

                    showMessage(
                        "Login successful! Opening SkillBridge...",
                        true
                    );

                    // Redirect after successful login
                    setTimeout(() => {
                        window.location.href = "domain.html";
                    }, 1000);

                } catch (error) {
                    showMessage(
                        "Cannot connect to the backend. Check that Flask is running."
                    );
                    console.error(error);
                } finally {
                    button.disabled = false;
                    button.textContent = "Login";
                }
            });
    </script>
</body>
</html>
